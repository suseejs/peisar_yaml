[package]
name = "peisar_yaml"
version = "0.1.0"
edition = "2024"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/phothinmg/peisar"
description = "A YAML parsing helpers for Rust and an optional N-API interface for Node.js"


[dependencies]
noyalib = "0.0.58"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
napi = { version = "3", features = ["serde-json"], optional = true }
napi-derive = { version = "3", optional = true }

[lib]
name = "peisar_yaml"
path = "src/lib.rs"

[features]
default = []
npm = ["dep:napi", "dep:napi-derive"]
